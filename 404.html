<!doctype html>
<html lang="en" data-theme="cosmic">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#041128" />
    <title>404 — Lost in Deep Space | NakharaX Group</title>
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="brand.css" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 30%, #0a1c3d 0%, #041128 70%);
        color: var(--ink, #f4f6fb);
        font-family: "Space Grotesk", "Noto Sans Thai", sans-serif;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      .error-card {
        max-width: 540px;
        background: rgba(14, 18, 34, 0.75);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 20px;
        padding: 48px 32px;
        backdrop-filter: blur(16px);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 40px rgba(56, 189, 248, 0.1);
      }
      .error-badge {
        display: inline-block;
        font-size: 0.85rem;
        font-weight: 600;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: #e5c896;
        border: 1px solid rgba(229, 200, 150, 0.3);
        padding: 6px 16px;
        border-radius: 999px;
        margin-bottom: 24px;
      }
      .error-code {
        font-size: clamp(4.5rem, 12vw, 7rem);
        font-weight: 800;
        line-height: 1;
        margin: 0;
        background: linear-gradient(135deg, #fff 0%, #38bdf8 50%, #e5c896 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .error-title {
        font-size: 1.5rem;
        margin: 16px 0 12px;
        font-weight: 600;
      }
      .error-desc {
        color: #a3adc2;
        font-size: 1rem;
        line-height: 1.6;
        margin: 0 0 32px;
      }
      .btn-home {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: linear-gradient(135deg, #e5c896, #d4af37);
        color: #041128;
        font-weight: 700;
        text-decoration: none;
        padding: 14px 28px;
        border-radius: 999px;
        transition: transform 0.2s, box-shadow 0.2s;
        box-shadow: 0 4px 20px rgba(229, 200, 150, 0.3);
      }
      .btn-home:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 30px rgba(229, 200, 150, 0.5);
      }
    </style>
  </head>
  <body>
    <main class="error-card">
      <div class="error-badge">Navigation Alert · พิกัดสูญหาย</div>
      <h1 class="error-code">404</h1>
      <h2 class="error-title">Lost in Deep Space</h2>
      <p class="error-desc">
        The celestial coordinates you are navigating do not exist within the NakharaX Solar System.<br />
        ไม่พบหน้าที่คุณกำลังค้นหาในระบบ NakharaX Group
      </p>
      <a href="./" class="btn-home">
        <span>← Return to Mothership / กลับสู่หน้าหลัก</span>
      </a>
    </main>
  </body>
</html>
